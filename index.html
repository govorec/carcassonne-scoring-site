function applyLang(lang) {
  const d = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = d[el.dataset.i18n];
    if (v) el.textContent = v;
  });
  document.getElementById('heroTitle').innerHTML = d.hero_title; // trusted local dictionary only
  document.querySelectorAll('img[data-shot]').forEach(img => {
    img.src = 'assets/shots/' + lang + '/' + img.dataset.shot + '.png';
  });
  document.querySelectorAll('.lang-link').forEach(el => el.classList.toggle('active', el.dataset.lang === lang));
  document.title = 'Carcassonne Scoring — ' + d.subtitle;
  try { localStorage.setItem('lang', lang); } catch (e) {}
}

document.getElementById('langNav').addEventListener('click', e => {
  const lang = e.target.dataset && e.target.dataset.lang;
  if (lang) applyLang(lang);
});

let initial = null;
try { initial = localStorage.getItem('lang'); } catch (e) {}
if (!initial || !T[initial]) {
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  initial = T[nav] ? nav : 'en';
}
applyLang(initial);

// B-43: carry the inbound utm_source into the App Store campaign token (ct),
// otherwise Apple's last-touch attribution credits the landing, not the channel.
(function () {
  var src = new URLSearchParams(location.search).get('utm_source');
  if (!src) return; // direct visit — keep default landing_hero/landing_footer
  var token = 'landing_' + src.toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 32);
  document.querySelectorAll('a[href*="apps.apple.com"]').forEach(function (a) {
    var u = new URL(a.href);
    u.searchParams.set('ct', token);
    a.href = u.toString();
  });
})();
</script>
